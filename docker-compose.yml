services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: merchantgpt
      POSTGRES_PASSWORD: merchantgpt
      POSTGRES_DB: merchantgpt
    volumes:
      - merchantgpt_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merchantgpt -d merchantgpt"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://merchantgpt:merchantgpt@db:5432/merchantgpt
      DATABASE_URL_SYNC: postgresql+psycopg2://merchantgpt:merchantgpt@db:5432/merchantgpt
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  merchantgpt_pgdata:
